name: Docker Image CI

on:
  push:
    branches: [ "master" ] # Trigger on pushes to master
  pull_request:
    branches: [ "master" ] # Also trigger on PRs to master (will only build, not push)

env:
  # Define the registry and image name.
  # ghcr.io requires lowercase repository names.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ lower(github.repository) }} # Uses format owner/repo

jobs:
  build_and_push: # Combined build and potentially push job
    runs-on: ubuntu-latest
    # Required permissions for pushing to GHCR using GITHUB_TOKEN
    permissions:
      contents: read # To checkout the code
      packages: write # To push packages (docker images) to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        # This step only runs for pushes to the master branch, where we intend to publish.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }} # Use the GitHub actor (user/bot triggering the workflow)
          password: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN has automatic permissions for GHCR within the same repo

      - name: Extract Docker metadata (tags, labels)
        id: meta # Give the step an ID to reference its outputs
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Define tagging strategy:
          tags: |
            # Creates a tag with the Git commit SHA (e.g., ghcr.io/owner/repo:abc1234) - good for traceability
            type=sha,prefix=
            # Creates 'latest' tag only on pushes to the default branch (master in this case)
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # The build context directory (where your code and Dockerfile are)
          file: ./docker/Dockerfile # Path to your Dockerfile relative to the context
          # Only push the image if the event is a push to the master branch.
          # For pull requests, it will only build the image.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }} # Use the tags generated by the metadata step
          labels: ${{ steps.meta.outputs.labels }} # Use the labels generated by the metadata step
          # Enable build cache using GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
